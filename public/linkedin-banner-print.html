<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Mieterlotse · LinkedIn Banner (print)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ml-ink: #0f172a;
        --ml-cta: #ec6426;
        --ml-cta-soft: #fde4d1;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ml-ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .banner {
        position: relative;
        width: 1584px;
        height: 396px;
        background: #ffffff;
        overflow: hidden;
      }

      /* ───── orange stripes ───── */
      .stripe-top,
      .stripe-bottom {
        position: absolute;
        left: 0;
        background: var(--ml-cta);
      }
      .stripe-top { top: 0; right: 0; height: 6px; }
      .stripe-bottom { bottom: 0; right: 460px; height: 4px; }

      /* ───── right panel (peach) ───── */
      .right {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 460px;
        background: var(--ml-cta-soft);
      }
      .right-divider {
        position: absolute;
        top: 28px;
        bottom: 28px;
        left: 0;
        width: 1px;
        background: rgba(236, 100, 38, 0.22);
      }

      .kpis {
        position: absolute;
        top: 56px;
        left: 56px;
        right: 56px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .kpi-value {
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.025em;
        color: var(--ml-cta);
        line-height: 1;
      }
      .kpi-value .infinity {
        font-size: 36px;
        line-height: 0.85;
        display: inline-block;
      }
      .kpi-label {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 500;
        color: var(--ml-ink);
        letter-spacing: -0.005em;
        line-height: 1.35;
      }

      .url {
        position: absolute;
        bottom: 50px;
        left: 56px;
        right: 56px;
        font-size: 17px;
        font-weight: 700;
        color: var(--ml-cta);
        letter-spacing: -0.01em;
        line-height: 1;
      }

      /* ───── left panel ─────
         Layout-Constraint: LinkedIn legt das runde Profilfoto
         über die linke untere Bildhälfte (≈ x 0–270, y 70–396).
         Sämtliche Inhalte sitzen rechts davon (left: 290).
         Logo + Headline werden im oberen Bereich gestapelt,
         damit der Avatar nichts überdeckt. */
      .left {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 460px;
      }

      .logo {
        position: absolute;
        top: 56px;
        left: 380px;
        display: inline-flex;
        align-items: baseline;
        line-height: 1;
      }
      .logo-wordmark {
        font-weight: 800;
        font-size: 60px;
        letter-spacing: -0.035em;
        line-height: 1;
        color: var(--ml-ink);
        text-transform: lowercase;
        white-space: nowrap;
      }
      .logo-i {
        position: relative;
        display: inline-block;
      }
      .logo-arrow {
        position: absolute;
        left: 50%;
        top: -15px;
        transform: translateX(-50%);
        width: 28px;
        height: 28px;
        pointer-events: none;
      }

      .headline {
        position: absolute;
        top: 168px;
        left: 380px;
        right: 90px;
        font-weight: 900;
        font-size: 44px;
        line-height: 1.07;
        letter-spacing: -0.035em;
        color: var(--ml-ink);
      }
      .highlight {
        display: inline;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        padding-inline: 6px;
        margin-inline: -6px;
        background-image: linear-gradient(
          to top,
          rgba(253, 216, 53, 0.42) 0%,
          rgba(253, 216, 53, 0.42) 38%,
          transparent 38%
        );
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <!-- Right peach panel -->
      <div class="right">
        <div class="right-divider"></div>
        <div class="kpis">
          <div>
            <div class="kpi-value">24/7</div>
            <div class="kpi-label">KI-Telefon &amp; E-Mail</div>
          </div>
          <div>
            <div class="kpi-value">
              <span class="infinity">&#x221E;</span>
            </div>
            <div class="kpi-label">Unbegrenzte Anrufminuten</div>
          </div>
          <div>
            <div class="kpi-value">30 Tage</div>
            <div class="kpi-label">Live-Pilot — kostenlos starten</div>
          </div>
        </div>
        <div class="url">immobilienverwaltung-automation.de</div>
      </div>

      <!-- Left content -->
      <div class="left">
        <div class="logo" aria-label="mieterlotse">
          <span class="logo-wordmark"
            >m<span class="logo-i"
              >&#x0131;<svg class="logo-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20.2 3.8 L5.1 11.1 L11.7 13.4 L14.1 19.9 Z"
                  fill="var(--ml-cta)"
                /></svg></span
            >eterlotse</span
          >
        </div>

        <h1 class="headline">
          Ihr Team soll verwalten.<br />
          Nicht Anfragen <span class="highlight">beantworten.</span>
        </h1>
      </div>

      <!-- Stripes on top of everything -->
      <div class="stripe-top"></div>
      <div class="stripe-bottom"></div>
    </div>
  </body>
</html>
